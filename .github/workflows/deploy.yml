name: Auto Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Sync Code to InfinityFree (htdocs)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Sync seluruh kodingan Laravel langsung ke /htdocs/ di InfinityFree
      - name: 📂 Upload Seluruh Project ke /htdocs/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**
            .env
            docs/**
            README.md
