name: Auto Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Sync Code to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 1. Sync file inti Laravel ke folder /core/ di server
      - name: 📂 Upload Core Laravel ke /core/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /core/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            public/**
            .env
            docs/**
            README.md

      # 2. Sync asset publik (css, js, images) ke folder /htdocs/ di server
      - name: 🌐 Upload Public Assets ke /htdocs/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /htdocs/
          exclude: |
            index.php
            .htaccess
